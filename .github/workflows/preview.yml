name: Check & Preview

on:
  push:
    branches:
      - master
      - dev
      - "wiki/**"
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:
    name: check-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

      - name: Run Astro typecheck
        run: bun run check

      - name: Build static site
        run: bun run build

      - name: Deploy preview to Cloudflare Pages
        if: github.event_name == 'push' && github.ref_name != 'master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5d5874bf694664f9e52b3c2809d61f74
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            bunx wrangler pages deploy dist --project-name=build-the-pyramid-wiki --branch="${GITHUB_REF_NAME}"
          fi
